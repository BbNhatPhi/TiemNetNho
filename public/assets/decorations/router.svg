<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 46" width="56" height="46">
  <!-- Ground / Shelf Shadow -->
  <ellipse cx="28" cy="42" rx="22" ry="3.5" fill="#4a3b32" opacity="0.18" />

  <!-- Antennas (2 cute clean antennas matching the game's cartoon style) -->
  <!-- Left antenna -->
  <path d="M 17,25 L 11,6" stroke="#4a3b32" stroke-width="3" stroke-linecap="round" />
  <circle cx="11" cy="6" r="2" fill="#c25953" />
  <!-- Right antenna -->
  <path d="M 39,25 L 45,6" stroke="#4a3b32" stroke-width="3" stroke-linecap="round" />
  <circle cx="45" cy="6" r="2" fill="#c25953" />

  <!-- Modem Body Base / Bottom Rim -->
  <rect x="6" y="27" width="44" height="13" rx="5" fill="#e2d8ce" stroke="#4a3b32" stroke-width="3" stroke-linejoin="round" />

  <!-- Modem Main Body (Cozy cream white, matching room aesthetic) -->
  <rect x="6" y="22" width="44" height="14" rx="5" fill="#fff8f2" stroke="#4a3b32" stroke-width="3" stroke-linejoin="round" />

  <!-- Subtle Top Plate Bevel -->
  <rect x="10" y="24" width="36" height="3" rx="1.5" fill="#f0e6dc" />

  <!-- Front Indicator Strip -->
  <rect x="12" y="29" width="32" height="4.5" rx="2" fill="#4a3b32" opacity="0.12" />

  <!-- 4 Cute Status LEDs (Power, WAN, Wi-Fi, LAN) -->
  <circle cx="16" cy="31.2" r="1.3" fill="#64c48a" />
  <circle cx="23" cy="31.2" r="1.3" fill="#64c48a" />
  <circle cx="30" cy="31.2" r="1.3" fill="#64c48a" />
  <circle cx="37" cy="31.2" r="1.3" fill="#64c48a" />

  <!-- Cute mini Wi-Fi symbol engraved on top -->
  <path d="M 25,25.5 Q 28,23.5 31,25.5" fill="none" stroke="#c25953" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  <circle cx="28" cy="27" r="0.8" fill="#c25953" opacity="0.75" />
</svg>