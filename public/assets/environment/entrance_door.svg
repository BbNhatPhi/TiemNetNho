<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <defs>
    <!-- Glass gradient with bright reflections -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#dff9fb" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#c7ecee" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="doorFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#576574"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
    <linearGradient id="awningGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
  </defs>

  <!-- Door Threshold on the floor -->
  <rect x="10" y="86" width="140" height="10" rx="3" fill="#ced6e0" stroke="#4a3b32" stroke-width="2.5"/>
  <line x1="14" y1="91" x2="146" y2="91" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Outer Door Frame (Sturdy aluminum frame) -->
  <rect x="12" y="16" width="136" height="72" rx="4" fill="url(#doorFrameGrad)" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/>

  <!-- LEFT GLASS DOOR -->
  <rect x="18" y="22" width="60" height="64" rx="2" fill="url(#glassReflection)" stroke="#4a3b32" stroke-width="2.5"/>
  <!-- Glass shine diagonals -->
  <polygon points="22,24 38,24 24,65 19,65" fill="#ffffff" opacity="0.6"/>
  <polygon points="44,24 50,24 32,78 26,78" fill="#ffffff" opacity="0.4"/>
  <!-- Door push handle (long vertical metal bar) -->
  <rect x="68" y="44" width="4" height="24" rx="2" fill="#dfe4ea" stroke="#4a3b32" stroke-width="1.5"/>
  <!-- Push sticker ("ĐẨY") -->
  <rect x="36" y="52" width="22" height="10" rx="2" fill="#2ed573" stroke="#4a3b32" stroke-width="1.5"/>
  <text x="47" y="59.5" font-family="'Nunito', sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">ĐẨY</text>

  <!-- RIGHT GLASS DOOR -->
  <rect x="82" y="22" width="60" height="64" rx="2" fill="url(#glassReflection)" stroke="#4a3b32" stroke-width="2.5"/>
  <!-- Glass shine diagonals -->
  <polygon points="86,24 102,24 88,65 83,65" fill="#ffffff" opacity="0.6"/>
  <polygon points="108,24 114,24 96,78 90,78" fill="#ffffff" opacity="0.4"/>
  <!-- Door pull handle (long vertical metal bar) -->
  <rect x="88" y="44" width="4" height="24" rx="2" fill="#dfe4ea" stroke="#4a3b32" stroke-width="1.5"/>
  <!-- Pull sticker ("KÉO") -->
  <rect x="102" y="52" width="22" height="10" rx="2" fill="#ff4757" stroke="#4a3b32" stroke-width="1.5"/>
  <text x="113" y="59.5" font-family="'Nunito', sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">KÉO</text>

  <!-- TOP TRANSOM / SIGNBOARD -->
  <!-- Header frame -->
  <rect x="8" y="2" width="144" height="18" rx="4" fill="url(#awningGrad)" stroke="#4a3b32" stroke-width="3" stroke-linejoin="round"/>
  <!-- Golden inner border -->
  <rect x="12" y="5" width="136" height="12" rx="2" fill="none" stroke="#fed330" stroke-width="1.5"/>
  <!-- Store sign text -->
  <text x="80" y="14" font-family="'Nunito', sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">★ TIỆM NET NHỎ ★</text>
  <!-- Little green "OPEN" indicator on top right -->
  <circle cx="140" cy="11" r="2.5" fill="#2ed573" stroke="#4a3b32" stroke-width="1"/>
</svg>

