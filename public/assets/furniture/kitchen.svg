<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="180" height="110">
  <defs>
    <linearGradient id="kitchenFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cf6660"/>
      <stop offset="100%" stop-color="#a8433d"/>
    </linearGradient>
    <linearGradient id="steelCounter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f2f6"/>
      <stop offset="50%" stop-color="#dfe4ea"/>
      <stop offset="100%" stop-color="#ced6e0"/>
    </linearGradient>
    <linearGradient id="panMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57606f"/>
      <stop offset="100%" stop-color="#2f3542"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="90" cy="102" rx="84" ry="7" fill="#4a3b32" opacity="0.2"/>

  <!-- Counter Base Structure -->
  <!-- Shadow / 3D depth -->
  <rect x="6" y="38" width="168" height="64" rx="14" fill="#80332e"/>
  <!-- Front counter body -->
  <rect x="6" y="34" width="168" height="64" rx="14" fill="url(#kitchenFront)" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/>

  <!-- Base plinth / foot guard -->
  <rect x="14" y="86" width="152" height="8" rx="3" fill="#4a3b32" opacity="0.25"/>

  <!-- Kitchen Storage Cabinets / Shelves -->
  <!-- Left Side: Cutlery and spice drawers -->
  <rect x="16" y="44" width="46" height="18" rx="4" fill="#b94e48" stroke="#4a3b32" stroke-width="2.5"/>
  <rect x="33" y="51" width="12" height="4" rx="2" fill="#e6d5c3"/>
  <rect x="16" y="67" width="46" height="18" rx="4" fill="#b94e48" stroke="#4a3b32" stroke-width="2.5"/>
  <rect x="33" y="74" width="12" height="4" rx="2" fill="#e6d5c3"/>

  <!-- Center / Right: Open Ingredient Rack (Instant Noodles & Drinks) -->
  <rect x="68" y="44" width="96" height="41" rx="6" fill="#fff8f2" stroke="#4a3b32" stroke-width="3"/>
  <!-- Shelf divider -->
  <line x1="68" y1="65" x2="164" y2="65" stroke="#4a3b32" stroke-width="2.5"/>

  <!-- TOP SHELF: Instant Noodle Cups & Packs -->
  <!-- Pink Noodle Cup (Hảo Hảo Tôm Chua Cay) -->
  <rect x="74" y="48" width="14" height="15" rx="3" fill="#ff78b9" stroke="#4a3b32" stroke-width="1.5"/>
  <rect x="73" y="47" width="16" height="3" rx="1" fill="#ffffff" stroke="#4a3b32" stroke-width="1"/>
  <text x="81" y="57" font-family="sans-serif" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle">HH</text>

  <!-- Red Noodle Cup (Omachi Bò Kho) -->
  <rect x="92" y="48" width="14" height="15" rx="3" fill="#eb3b5a" stroke="#4a3b32" stroke-width="1.5"/>
  <rect x="91" y="47" width="16" height="3" rx="1" fill="#fed330" stroke="#4a3b32" stroke-width="1"/>
  <text x="99" y="57" font-family="sans-serif" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle">OMA</text>

  <!-- Yellow Noodle Pack (Kokomi) -->
  <rect x="110" y="49" width="16" height="14" rx="2" fill="#f7b731" stroke="#4a3b32" stroke-width="1.5"/>
  <circle cx="118" cy="56" r="3" fill="#eb3b5a"/>

  <!-- Stored condiment jars -->
  <rect x="130" y="49" width="11" height="14" rx="2" fill="#fa8231" stroke="#4a3b32" stroke-width="1.5"/>
  <rect x="144" y="48" width="12" height="15" rx="2" fill="#ffffff" stroke="#4a3b32" stroke-width="1.5"/>

  <!-- BOTTOM SHELF: Drink Cans & Bottles (Sting, Pepsi, Redbull) -->
  <!-- Red Sting Bottle -->
  <rect x="75" y="68" width="8" height="16" rx="2" fill="#eb3b5a" stroke="#4a3b32" stroke-width="1.5"/>
  <rect x="77" y="66" width="4" height="3" fill="#fed330"/>
  <!-- Blue Pepsi Can -->
  <rect x="88" y="70" width="10" height="14" rx="2" fill="#3867d6" stroke="#4a3b32" stroke-width="1.5"/>
  <ellipse cx="93" cy="74" rx="3" ry="2" fill="#ffffff"/>
  <!-- Gold Redbull Can -->
  <rect x="102" y="71" width="11" height="13" rx="2" fill="#fed330" stroke="#4a3b32" stroke-width="1.5"/>
  <circle cx="107" cy="77" r="3" fill="#eb3b5a"/>
  <!-- Green Mountain Dew / 7Up Can -->
  <rect x="117" y="70" width="10" height="14" rx="2" fill="#20bf6b" stroke="#4a3b32" stroke-width="1.5"/>
  <!-- Water Bottle -->
  <rect x="131" y="68" width="9" height="16" rx="2" fill="#45aaf2" stroke="#4a3b32" stroke-width="1.5"/>
  <!-- Fresh Egg Crate -->
  <rect x="144" y="72" width="16" height="12" rx="2" fill="#e8cfb5" stroke="#4a3b32" stroke-width="1.5"/>
  <circle cx="148" cy="74" r="2.5" fill="#f5cd79"/>
  <circle cx="155" cy="74" r="2.5" fill="#f5cd79"/>

  <!-- Stainless Steel Countertop -->
  <rect x="2" y="24" width="176" height="16" rx="8" fill="#ced6e0"/>
  <rect x="2" y="22" width="176" height="14" rx="8" fill="url(#steelCounter)" stroke="#4a3b32" stroke-width="4" stroke-linejoin="round"/>
  <line x1="12" y1="26" x2="168" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- COOKING EQUIPMENT ON COUNTER -->

  <!-- 1. Cooking Stove & Frying Pan - Left -->
  <!-- Induction Cooker Plate -->
  <rect x="12" y="19" width="46" height="9" rx="3" fill="#2d3436" stroke="#4a3b32" stroke-width="2"/>
  <ellipse cx="35" cy="23" rx="14" ry="3" fill="#ff7675" opacity="0.8"/>
  <ellipse cx="35" cy="23" rx="8" ry="1.5" fill="#ffeaa7"/>

  <!-- Frying Pan / Wok -->
  <ellipse cx="34" cy="18" rx="20" ry="8" fill="url(#panMetal)" stroke="#4a3b32" stroke-width="2.5"/>
  <ellipse cx="34" cy="18" rx="17" ry="6" fill="#3d3d3d"/>
  <!-- Pan Handle -->
  <path d="M 14,18 L 4,14" stroke="#4a3b32" stroke-width="4" stroke-linecap="round"/>
  <!-- Sunny-side-up egg in pan 🍳 -->
  <ellipse cx="32" cy="18" rx="7" ry="3.5" fill="#ffffff"/>
  <circle cx="33" cy="18" r="3" fill="#f39c12"/>
  <circle cx="32" cy="17" r="1" fill="#ffffff" opacity="0.8"/>
  <!-- Scallions sprinkles (hành lá) -->
  <circle cx="28" cy="19" r="0.8" fill="#2ed573"/>
  <circle cx="38" cy="17" r="0.8" fill="#2ed573"/>
  <circle cx="36" cy="20" r="0.8" fill="#2ed573"/>

  <!-- 2. Electric Hot Water Boiler / Kettle (for pouring noodle soup) -->
  <rect x="66" y="9" width="18" height="18" rx="4" fill="#dfe4ea" stroke="#4a3b32" stroke-width="2.5"/>
  <rect x="68" y="6" width="14" height="4" rx="2" fill="#747d8c" stroke="#4a3b32" stroke-width="1.5"/>
  <rect x="80" y="14" width="4" height="8" rx="1" fill="#747d8c"/> <!-- Handle -->
  <path d="M 66,16 L 62,18 L 66,20" fill="#747d8c" stroke="#4a3b32" stroke-width="1.5"/> <!-- Spout -->
  <circle cx="71" cy="23" r="1.5" fill="#2ed573"/> <!-- Power indicator light -->

  <!-- 3. Condiments (Chin-su Chili Sauce & Pepper) - Center Right -->
  <!-- Red Chili Sauce Bottle (Chai tương ớt Chin-su) -->
  <rect x="94" y="10" width="7" height="16" rx="2" fill="#eb3b5a" stroke="#4a3b32" stroke-width="2"/>
  <polygon points="95,10 100,10 97.5,5" fill="#f7b731" stroke="#4a3b32" stroke-width="1.5"/>
  <rect x="95" y="14" width="5" height="5" fill="#ffffff"/>

  <!-- 4. Drink Station: Ice Cup with Straw & Sting Can - Right -->
  <!-- Glass Cup with Ice and Straw -->
  <polygon points="112,13 126,13 124,27 114,27" fill="#eaf4f4" stroke="#4a3b32" stroke-width="2"/>
  <!-- Orange/Red drink liquid inside -->
  <polygon points="113.5,17 124.5,17 123.5,26 114.5,26" fill="#ff6b81" opacity="0.85"/>
  <!-- Ice cubes floating -->
  <rect x="116" y="16" width="4" height="4" rx="1" fill="#ffffff" opacity="0.8"/>
  <rect x="121" y="18" width="3" height="3" rx="1" fill="#ffffff" opacity="0.8"/>
  <!-- Striped Drinking Straw -->
  <line x1="120" y1="24" x2="128" y2="5" stroke="#fed330" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="24" x2="128" y2="5" stroke="#eb3b5a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Bowl of hot noodles with chopsticks -->
  <ellipse cx="148" cy="21" rx="14" ry="7" fill="#ffffff" stroke="#4a3b32" stroke-width="2.5"/>
  <ellipse cx="148" cy="20" rx="12" ry="5" fill="#fed330"/> <!-- Noodle broth -->
  <!-- Chopsticks resting across bowl -->
  <line x1="135" y1="14" x2="160" y2="23" stroke="#8c7a6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="137" y1="12" x2="162" y2="21" stroke="#8c7a6b" stroke-width="2" stroke-linecap="round"/>

  <!-- Steam puffs rising from food ♨️ -->
  <path d="M 32,8 Q 30,3 34,0" fill="none" stroke="#ced6e0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 37,10 Q 39,5 36,2" fill="none" stroke="#ced6e0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 148,11 Q 146,6 150,3" fill="none" stroke="#ced6e0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>